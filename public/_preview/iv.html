<p class="note">All five keep what you liked: the full-bleed hero, the huge headline, the glass card, the six-slide gallery, and the photo-dark / piece-cream switch. <b>Change anything</b> (metal, gold, shape, stone colour) and the pictures, title and price follow. <b>Prices are illustrative.</b></p>

let raf=0;

 if(S.o==="4"){H.querySelectorAll(".cf").forEach((c,i)=>{const d=i-S.i,a=Math.abs(d);c.style.transform=`translateX(${d*(ph()?62:56)}%) scale(${a===0?1:Math.max(.5,.84-a*.08)})`;c.style.opacity=a>2?0:a===0?1:.5;c.style.zIndex=10-a;c.style.filter=a===0?"none":"brightness(.6)"})}
 else if(S.o==="2"){const sl=[...H.querySelectorAll(".sl")];const cur=sl[S.i];if(!cur.classList.contains("on")){cur.style.zIndex=String(++Z);cur.classList.add("on");setTimeout(()=>sl.forEach(e=>{if(e!==cur&&parseInt(e.style.zIndex||0)<parseInt(cur.style.zIndex||0))e.classList.remove("on")}),1050)}}
 else H.querySelectorAll(".sl").forEach((e,i)=>e.classList.toggle("on",i===S.i));
 H.querySelectorAll("[data-go]").forEach(e=>{if(e.tagName==="BUTTON")e.classList.toggle("on",+e.dataset.go===S.i)});
 [".count .segs i",".segs-top i"].forEach(q=>H.querySelectorAll(q).forEach((e,i)=>e.classList.toggle("on",i===S.i)));

 H.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));const pv=$("#prev"),nx=$("#next");if(pv)pv.onclick=()=>go(S.i-1);if(nx)nx.onclick=()=>go(S.i+1);wireCtrl();
 let x0=null;H.onpointerdown=e=>{if(e.target.closest(".card,.bar,.dock,.drawer,.thumbs,.pth,.arr,.cf"))return;x0=e.clientX};H.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50)go(S.i+(dx<0?1:-1));else if(ph()&&Math.abs(dx)<10){const r=H.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;if(f>.66)go(S.i+1);else if(f<.34)go(S.i-1)}};
 H.onmousemove=e=>{if(ph())return;const r=H.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;if(S.o==="3"){const g=H.querySelector(".sl.on .gt");if(g)g.style.transform=`translate(calc(-50% + ${x*-36}px),calc(-50% + ${y*-20}px))`}else{const on=H.querySelector(".sl.photo.on img");if(on&&S.o!=="2"&&S.o!=="4")on.style.transform=`translate(${x*-20}px,${y*-12}px) scale(1.1)`}}}
